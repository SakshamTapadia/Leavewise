name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android and iOS runner folders are generated once, then committed.
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org com.leavewise --project-name leavewise .
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org com.leavewise --project-name leavewise .
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: leavewise-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
